# BookForge / __PROFILE__ — edit freely after initialization.
# The chapter list is maintained by `bookforge forge`.
project:
  type: book

book:
  title: "BookForge 书籍生成器"
  author: "三非"
  date: ""
  chapters:
    - index.qmd

lang: zh-CN

format:
  pdf:
    pdf-engine: xelatex
    documentclass: scrbook
    classoption: [oneside, open=any, headings=big]
    # A compact literary trim size; edit geometry for your printer.
    geometry:
      - paperwidth=170mm
      - paperheight=240mm
      - top=25mm
      - bottom=23mm
      - inner=25mm
      - outer=22mm
      - headsep=9mm
      - footskip=11mm
    fontsize: 11pt
    linestretch: 1.32
    indent: true
    mainfont: "__MAIN__"
    sansfont: "__SANS__"
    monofont: "__MONO__"
    mathfont: "__MATH__"
    toc: true
    toc-depth: 2
    toc-title: "目录"
    number-sections: false # AI chapters often include their own chapter numbers.
    colorlinks: true
    linkcolor: "__ACCENT__"
    urlcolor: "__ACCENT__"
    citecolor: "__ACCENT__"
    crossref:
      fig-prefix: "图"
      tbl-prefix: "表"
      eq-prefix: "式"
      sec-prefix: "节"
    include-in-header:
      - text: |
          \usepackage{xeCJK}
          % Portable profile resolves Fandol by its TeX Live font filename.
          __CJK_SETUP__
          % Preserve the author's space in e.g. “第一章 这是一个标题”.
          \xeCJKsetup{CJKspace=true}
          \usepackage{microtype}
          \usepackage{booktabs}
          \usepackage{longtable}
          \definecolor{bookaccent}{HTML}{__ACCENT_HEX__}
          \definecolor{bookmuted}{HTML}{__MUTED_HEX__}
          \definecolor{bookpaper}{HTML}{F4F1EA}
          \setkomafont{chapter}{\normalfont\huge\bfseries\color{bookaccent}__HEADING__}
          \setkomafont{section}{\normalfont\Large\bfseries\color{bookaccent}}
          \setkomafont{subsection}{\normalfont\large\bfseries\color{bookaccent}}
          \setkomafont{pageheadfoot}{\normalfont\small\color{bookmuted}}
          \setkomafont{pagenumber}{\normalfont\small\color{bookmuted}}
          \KOMAoptions{headsepline=false,footsepline=false}
          \usepackage[automark]{scrlayer-scrpage}
          \clearpairofpagestyles
          \automark[section]{chapter}
          \ihead{\headmark}
          \ofoot*{\pagemark}
          \pagestyle{scrheadings}
          \renewcommand*{\chapterpagestyle}{plain.scrheadings}
          % A quiet, typographic cover: warm paper, generous space, one accent rule.
          \makeatletter
          \renewcommand{\maketitle}{%
            \begin{titlepage}
            \thispagestyle{empty}\pagecolor{bookpaper}\color{black}
            \vspace*{0.16\textheight}
            {\large\sffamily\bfseries\color{bookaccent} BOOKFORGE\hspace{0.6em}/\hspace{0.6em}一本书\par}
            \vspace{1.8cm}
            {\color{bookaccent}\rule{0.20\textwidth}{2pt}\par}
            \vspace{1.0cm}
            {\normalfont\huge\bfseries\raggedright\@title\par}
            \vspace{0.8cm}
            {\large\color{bookmuted}\@author\par}
            \vfill
            {\small\sffamily\color{bookmuted}\@date\par}
            \vspace*{0.06\textheight}
            \end{titlepage}
            \nopagecolor\color{black}%
          }
          \makeatother
          \setlength{\parindent}{2em}
          \setlength{\parskip}{0pt}
          \emergencystretch=2em
          __DESIGN__
