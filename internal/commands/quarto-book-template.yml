format:
  pdf:
    # ---- 基础文档类 ----
    documentclass: scrbook
    classoption: [oneside, openright]
    papersize: b4
    geometry:
      - paperwidth=180mm
      - paperheight=240mm
      - top=22mm
      - bottom=18mm
      - inner=22mm
      - outer=25mm
      - marginparsep=6mm
      - marginparwidth=28mm
      - headsep=6mm
      - footskip=10mm
    fontsize: 12pt

    # ---- 行距与段落 ----
    linestretch: 1.35
    parskip: 0.8em
    parindent: 0pt

    # ========== 西文字体（Windows 默认） ==========
    mainfont: "Times New Roman"
    sansfont: "Arial"
    monofont: "Consolas"
    mathfont: "Cambria Math"

    # ========== 中文字体与数学宏包 ==========
    include-in-header:
      - text: |
          \usepackage{amsmath}
          \usepackage{amssymb}
          \usepackage{mathtools}
          \usepackage{xeCJK}
          \setCJKmainfont{SimSun}[BoldFont=SimHei, ItalicFont=KaiTi]
          \setCJKsansfont{Microsoft YaHei}[BoldFont=Microsoft YaHei Bold, ItalicFont=Microsoft YaHei]
          \setCJKmonofont{SimSun}
          \usepackage{unicode-math}
          \setmathfont{Cambria Math}
          \usepackage{bm}
          \usepackage{physics}
          \usepackage{siunitx}
          \AtBeginDocument{\let\boldsymbol\symbf}

    # ---- 目录与编号 ----
    toc: true
    toc-depth: 2
    lof: false
    lot: false
    toc-title: "目录"
    number-sections: false
    number-depth: 2

    # ---- 超链接 ----
    colorlinks: false
    linkbordercolor: white

    # ---- 交叉引用 ----
    crossref:
      fig-prefix: "图"
      tbl-prefix: "表"
      eq-prefix: "式"
      sec-prefix: "节"
      thm-prefix: "定理"
      def-prefix: "定义"

    # ---- 代码执行 ----
    execute:
      cache: true
      echo: false

    # ---- 编译引擎（lualatex） ----
    pdf-engine: xelatex
    latex-engine: xelatex

    # ---- 额外宏包 ----
    header-includes:
      - \usepackage{graphicx}
      - \usepackage{booktabs}
      - \usepackage{longtable}
